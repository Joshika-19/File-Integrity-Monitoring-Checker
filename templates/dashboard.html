<!DOCTYPE html>
<html>
<head>
    <title> File Integrity Monitoring Checker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #fbc2eb, #a6c1ee, #c2ffd8); /* pastel pink + blue + mint */
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
        }

        .card {
            background: rgba(255, 255, 255, 0.85);
            border-radius: 25px;
            padding: 25px;
            margin-top: 40px;
            box-shadow: 0px 8px 25px rgba(0,0,0,0.1);
        }

        h2 {
            color: #6a4c93; /* soft purple */
            font-weight: bold;
        }

        .table {
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
        }

        thead {
            background: linear-gradient(90deg, #ffafcc, #bde0fe, #caffbf);
            color: #333;
        }

        .safe {
            color: #2ecc71;
            font-weight: bold;
        }

        .modified {
            color: #ff6b6b;
            font-weight: bold;
        }

        .new {
            color: #4dabf7;
            font-weight: bold;
        }

        .btn-primary {
            background: linear-gradient(90deg, #a6c1ee, #fbc2eb);
            border: none;
            border-radius: 25px;
            color: #333;
            font-weight: bold;
            padding: 8px 20px;
            transition: 0.3s;
        }

        .btn-primary:hover {
            transform: scale(1.05);
            opacity: 0.9;
        }

        .btn-danger {
            border-radius: 25px;
        }

        input[type="file"] {
            padding: 6px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="card">

        <h2 class="text-center"> File Integrity Monitoring Checker</h2>

        <!-- Upload -->
        <form action="/upload" method="post" enctype="multipart/form-data" class="text-center mb-3">
            <input type="file" name="file" required>
            <button class="btn btn-primary">Upload</button>
            <a href="/clear" class="btn btn-danger">Clear</a>
        </form>

        <!-- Table -->
        <table class="table table-bordered text-center">
            <tr>
                <th>File</th>
                <th>Status</th>
                <th>Hash</th>
                <th>Uploaded Time</th>
                <th>Modified Time</th>
            </tr>

            {% for file, info in data.items() %}
            <tr>
                <td>{{ file }}</td>

                <td class="
                    {% if info.status == 'Safe' %}safe
                    {% elif info.status == 'Modified' %}modified
                    {% else %}new
                    {% endif %}
                ">
                    {{ info.status }}
                </td>

                <td style="font-size:10px;">{{ info.hash }}</td>
                <td>{{ info.upload_time }}</td>
                <td>{{ info.modified_time }}</td>
            </tr>
            {% endfor %}
        </table>

    </div>
</div>

</body>
</html>
